name: Tincture game CI

on:
  push:
    paths:
      - 'game/**'
      - '.github/workflows/tincture-game-ci.yml'
  pull_request:
    paths:
      - 'game/**'
      - '.github/workflows/tincture-game-ci.yml'

permissions:
  contents: read

jobs:
  verify-game:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Install dependencies
        run: npm --prefix game ci

      - name: Verify game
        run: npm --prefix game run verify

      - name: Install Playwright Chromium
        run: npm --prefix game exec -- playwright install chromium --with-deps

      - name: Run browser boot test
        run: npm --prefix game run e2e
